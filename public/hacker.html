<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Ethical Hacker Simulator</title>
<meta name="description" content="Hacker Typer — Online Ethical Hacker Simulator. Type on your keyboard to simulate hacking.">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #33ff33;
    --green-dim: #1a8c1a;
    --green-glow: 0 0 5px #33ff33, 0 0 10px #33ff3366;
    --red: #ff3333;
    --orange: #ff9900;
    --bg: #000000;
    --win-bg: #0d0d0d;
    --win-border: #2a2a2a;
    --titlebar-bg: #1a1a1a;
    --titlebar-border: #333333;
    --font: "Consolas", "Courier New", monospace;
    --btn-bg: #1c1c1c;
    --btn-border: #444;
    --text-dim: #444;
    --text-mid: #888;
    --dock-w: 54px;
  }

  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font);
    color: var(--green);
    user-select: none;
    cursor: default;
  }

  /* ─── SCANLINE OVERLAY ─── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ─── BACKGROUND TERMINAL ─── */
  #bg-terminal {
    position: fixed;
    top: 0; left: 0;
    right: var(--dock-w);
    bottom: 20px;
    padding: 6px 10px 6px 8px;
    font-size: 13px;
    line-height: 1.45;
    color: var(--green);
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-all;
    pointer-events: none;
    z-index: 0;
    text-shadow: var(--green-glow);
    opacity: 0.65;
  }

  /* ─── INTRO OVERLAY ─── */
  #intro {
    position: fixed; inset: 0;
    right: var(--dock-w);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 5; pointer-events: none;
    transition: opacity 0.8s ease;
    text-align: center; padding: 20px;
  }
  #intro.hidden { opacity: 0; }
  #intro h1 {
    font-size: 26px; font-weight: 700;
    color: var(--green);
    text-shadow: var(--green-glow);
    letter-spacing: 1px; margin-bottom: 14px;
    line-height: 1.3;
  }
  #intro p {
    font-size: 13px; color: #888;
    max-width: 480px; line-height: 1.7;
  }
  #btn-fullscreen {
    margin-top: 22px;
    padding: 7px 20px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--green);
    font-family: var(--font); font-size: 12px;
    cursor: pointer; pointer-events: all;
    letter-spacing: 1px;
    transition: background 0.15s, border-color 0.15s;
  }
  #btn-fullscreen:hover { background: #2a2a2a; border-color: var(--green); }

  /* ─── RIGHT DOCK ─── */
  #dock {
    position: fixed; right: 0; top: 0; bottom: 20px;
    width: var(--dock-w);
    display: flex; flex-direction: column;
    z-index: 800;
    background: #080808;
    border-left: 1px solid #1e1e1e;
    padding: 4px 0;
    overflow: hidden;
  }
  .dock-icon {
    width: 54px; min-height: 52px;
    flex: 0 0 auto;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    cursor: pointer;
    border: none; background: none;
    color: var(--green); font-family: var(--font);
    font-size: 10px; letter-spacing: 0.5px;
    transition: background 0.15s, filter 0.15s;
    padding: 6px 2px;
    border-bottom: 1px solid #111;
  }
  .dock-icon:hover { background: #141414; filter: brightness(1.5); }
  .dock-icon:active { background: #1a1a1a; }
  .dock-icon .di-glyph { font-size: 18px; line-height: 1; }
  .dock-icon .di-label { font-size: 7.5px; color: #666; text-align: center; letter-spacing: 0.3px; }

  /* ─── BOTTOM TASKBAR ─── */
  #taskbar {
    position: fixed; bottom: 0; left: 0; right: var(--dock-w);
    height: 20px;
    background: #050505;
    border-top: 1px solid #1a1a1a;
    display: flex; align-items: center;
    z-index: 800;
  }
  #btn-start {
    height: 100%;
    padding: 0 12px;
    background: #0f0f0f; border: none;
    border-right: 1px solid #222;
    color: #777; font-family: var(--font); font-size: 11px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #btn-start:hover { background: #1a1a1a; color: #bbb; }
  #key-hints {
    display: flex; align-items: center;
    padding: 0 6px; gap: 0;
    font-size: 9px; color: #333; font-family: var(--font);
    flex: 1;
  }
  .key-hint {
    padding: 0 5px; cursor: pointer;
    transition: color 0.1s; height: 100%;
    display: flex; align-items: center;
  }
  .key-hint:hover { color: #666; }
  #clock {
    padding: 0 8px;
    font-size: 9px; color: #333;
    border-left: 1px solid #1a1a1a;
    white-space: nowrap;
  }

  /* ─── WINDOW CHROME ─── */
  .win {
    position: fixed;
    background: var(--win-bg);
    border: 1px solid var(--win-border);
    font-family: var(--font);
    color: var(--green);
    min-width: 220px; min-height: 80px;
    display: flex; flex-direction: column;
    z-index: 100;
    box-shadow: 0 8px 48px rgba(0,0,0,0.95), 0 0 0 0.5px #33ff3311;
  }
  .win.focused { z-index: 200; border-color: #3a3a3a; }
  .win-titlebar {
    display: flex; align-items: center;
    background: var(--titlebar-bg);
    border-bottom: 1px solid var(--titlebar-border);
    padding: 0 6px; height: 24px;
    cursor: move; flex-shrink: 0;
    gap: 5px;
  }
  .win-title-icon { font-size: 12px; flex-shrink: 0; }
  .win-title-text {
    flex: 1; font-size: 10.5px; letter-spacing: 0.5px;
    color: #ccc; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .win-controls { display: flex; gap: 2px; flex-shrink: 0; }
  .win-btn {
    width: 18px; height: 15px; background: #1c1c1c;
    border: 1px solid #3a3a3a; color: #888;
    font-family: var(--font); font-size: 10px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    line-height: 1; padding: 0;
    transition: background 0.1s, color 0.1s;
  }
  .win-btn:hover { background: #2e2e2e; color: #fff; }
  .win-btn.close:hover { background: #3d0000; color: var(--red); border-color: #660000; }
  .win-body {
    flex: 1; overflow: hidden;
    font-size: 12px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 7px;
  }

  /* ─── GENERIC UI ─── */
  .green-text { color: var(--green); text-shadow: var(--green-glow); }
  .red-text { color: var(--red); text-shadow: 0 0 5px var(--red); }
  .orange-text { color: var(--orange); }
  .dim-text { color: var(--text-dim); }
  .mid-text { color: var(--text-mid); }

  .hk-btn {
    display: inline-block;
    padding: 5px 14px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--green); font-family: var(--font); font-size: 11px;
    cursor: pointer; letter-spacing: 1px;
    transition: background 0.15s, border-color 0.15s;
    text-align: center; white-space: nowrap;
  }
  .hk-btn:hover { background: #252525; border-color: #555; }
  .hk-btn:active { background: #2a2a2a; }
  .hk-btn:disabled { opacity: 0.4; cursor: default; }
  .hk-btn.red { color: var(--red); border-color: #440000; }
  .hk-btn.red:hover { border-color: var(--red); background: #1a0000; }

  .prog-track {
    height: 9px; background: #080808; border: 1px solid #222;
    position: relative; overflow: hidden;
  }
  .prog-fill {
    height: 100%; background: var(--green);
    box-shadow: 0 0 6px var(--green);
    transition: width 0.18s linear;
  }

  .data-table { border-collapse: collapse; width: 100%; font-size: 11px; }
  .data-table th, .data-table td {
    border: 1px solid #1e1e1e; padding: 3px 8px;
    text-align: right; font-family: var(--font);
  }
  .data-table th { background: #0a0a0a; color: #555; font-weight: normal; letter-spacing: 0.5px; }
  .data-table td { color: var(--green); }
  .data-table td:first-child, .data-table th:first-child { text-align: left; }
  .data-table tr.sum-row td { border-top: 1px solid #333; color: #aaa; }

  .log-scroll {
    overflow-y: auto; flex: 1;
    background: #040404; border: 1px solid #141414;
    padding: 5px 8px;
    font-size: 11px; line-height: 1.6;
    scrollbar-width: thin; scrollbar-color: #222 #080808;
  }
  .log-scroll p { margin: 0; }
  .log-scroll .lg { color: var(--green); text-shadow: var(--green-glow); }
  .log-scroll .lr { color: var(--red); }
  .log-scroll .lw { color: #ddd; }
  .log-scroll .ld { color: #444; }
  .log-scroll .lo { color: var(--orange); }

  /* ─── PASSIVE WINDOWS ─── */
  .passive-center {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; height: 100%; padding: 14px; gap: 10px;
  }
  .big-num {
    font-size: 52px; font-weight: 700; letter-spacing: 4px;
    color: var(--red); text-shadow: 0 0 24px var(--red), 0 0 4px var(--red);
    font-family: var(--font);
  }
  .stamp-box {
    border: 4px solid var(--red);
    padding: 6px 18px; transform: rotate(-12deg);
    font-size: 20px; font-weight: 700; letter-spacing: 5px;
    color: var(--red); text-shadow: 0 0 12px var(--red);
    display: inline-block; margin: 6px 0;
  }

  /* ─── ACCESS DENIED ─── */
  .access-denied-box {
    background: #0b0000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; padding: 18px; gap: 8px;
    animation: denyPulse 1.2s ease-in-out infinite;
  }
  @keyframes denyPulse {
    0%,100% { box-shadow: inset 0 0 40px rgba(255,0,0,0.08); }
    50% { box-shadow: inset 0 0 80px rgba(255,0,0,0.18); }
  }
  .deny-icon { font-size: 48px; color: var(--red); text-shadow: 0 0 20px var(--red); }
  .deny-title { font-size: 18px; font-weight: 700; color: var(--red); letter-spacing: 3px; text-shadow: 0 0 12px var(--red); }
  .deny-sub { font-size: 10px; color: #aa3333; letter-spacing: 0.5px; max-width: 250px; line-height: 1.6; }

  /* ─── PASSWORD CRACKER ─── */
  .crack-tabs { display: flex; border-bottom: 1px solid #222; margin-bottom: 7px; }
  .crack-tab {
    padding: 3px 12px; font-size: 11px; cursor: pointer;
    background: #0a0a0a; border: 1px solid #1e1e1e;
    border-bottom: none; color: #555;
    margin-right: 2px;
    transition: color 0.1s;
  }
  .crack-tab.active { background: var(--win-bg); color: var(--green); border-color: #333; }
  .crack-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 3px; margin: 4px 0;
  }
  .crack-cell {
    height: 20px; background: #080808;
    border: 1px solid #222;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #333; transition: all 0.2s;
  }
  .crack-cell.done { color: var(--green); border-color: #1a4a1a; background: #001500; }

  /* ─── INTERPOL ─── */
  .suspect-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 4px; border-bottom: 1px solid #111;
    cursor: pointer; transition: background 0.1s;
  }
  .suspect-row:hover { background: #0d0d0d; }
  .suspect-avatar {
    width: 36px; height: 46px; background: #111;
    border: 1px solid #2a2a2a; display: flex; align-items: center;
    justify-content: center; font-size: 20px; flex-shrink: 0;
  }
  .suspect-info { font-size: 10.5px; color: #888; }
  .suspect-info .suspect-name { color: var(--green); font-size: 11.5px; margin-bottom: 2px; }

  /* ─── SATELLITE ─── */
  .sat-phase { display: none; }
  .sat-phase.active { display: flex; flex-direction: column; align-items: center; gap: 8px; }

  /* ─── NUCLEAR ─── */
  .rod-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin: 4px 0; }
  .rod-cell {
    height: 36px; background: #080e08;
    border: 1px solid #122312;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: #1a3a1a; transition: all 0.4s;
  }
  .rod-cell.hot { background: #120800; border-color: #884400; color: #884400; }
  .rod-cell.critical { background: #120000; border-color: var(--red); color: var(--red); animation: critBlink 0.5s step-end infinite; }

  /* ─── REMOTE TERMINAL ─── */
  .remote-terminal {
    flex: 1; background: #020202;
    overflow-y: auto; padding: 8px;
    font-size: 12px; line-height: 1.55;
    scrollbar-width: thin; scrollbar-color: #222 #050505;
  }
  .remote-terminal p { margin: 0; color: var(--green); text-shadow: var(--green-glow); }
  .remote-terminal .rt-dim { color: #555; }
  .remote-terminal .rt-warn { color: var(--red); }

  /* ─── DOWNLOAD ─── */
  .dl-file-row { display: flex; align-items: center; gap: 7px; padding: 3px 0; border-bottom: 1px solid #111; }
  .dl-file-name { flex: 1; font-size: 10.5px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dl-file-pct { font-size: 10.5px; color: var(--green); width: 32px; text-align: right; flex-shrink: 0; }

  /* ─── IP LOCATOR ─── */
  .loc-phase { display: none; flex-direction: column; align-items: center; gap: 8px; }
  .loc-phase.active { display: flex; }

  /* ─── RESIZE ─── */
  .resize-handle {
    position: absolute; bottom: 0; right: 0;
    width: 12px; height: 12px; cursor: se-resize;
    background: linear-gradient(135deg, transparent 50%, #2a2a2a 50%);
  }

  /* ─── ANIMATIONS ─── */
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes critBlink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  @keyframes pulse { 0%,100%{opacity:0.7} 50%{opacity:1} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }

  .blink { animation: blink 1s step-end infinite; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .win { animation: fadeIn 0.15s ease-out; }

  /* ─── CCTV ─── */
  .cam-cell {
    background: #030303; border: 1px solid #141414;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    aspect-ratio: 4/3; position: relative;
    overflow: hidden;
  }
  .cam-cell::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(51,255,51,0.015) 3px, rgba(51,255,51,0.015) 4px
    );
    pointer-events: none;
  }
  .cam-static {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    opacity: 0.4;
  }

  /* ─── DEALS ─── */
  .deal-row { display:flex; gap:8px; padding:5px 4px; border-bottom:1px solid #0f0f0f; align-items:center; transition: background 0.1s; }
  .deal-row:hover { background: #0a0a0a; }

  /* ─── MINI INFO GRID ─── */
  .info-grid { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:11px; }
  .info-grid .ig-label { color: var(--text-mid); white-space: nowrap; }
  .info-grid .ig-val { color: var(--green); }
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════

/* ── CODE CORPUS (background terminal) ── */
const CODE_CORPUS = `#!/usr/bin/env python3
import os, sys, socket, struct, hashlib, threading, subprocess, time
from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
from cryptography.hazmat.backends import default_backend

TARGET_IP = "185.220.101.47"

class ExploitEngine:

        )
        encryptor = cipher.encryptor()
        padded = shellcode + b'\\x00' * (16 - len(shellcode) % 16)
        return encryptor.update(padded) + encryptor.finalize()

        cmds = [

def brute_force_ssh(ip, wordlist="/usr/share/wordlists/rockyou.txt"):

class NetworkScanner:
    PORTS = [21,22,23,25,53,80,110,135,139,143,443,445,993,3306,3389,5900,8080]

    def __init__(self, subnet):

        self.results = {}

    def scan_host(self, ip):
        open_ports = []
        for port in self.PORTS:
            try:
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.settimeout(0.4)
                if s.connect_ex((str(ip), port)) == 0:
                    open_ports.append(port)
                s.close()
            except:
                pass
        if open_ports:
            self.results[str(ip)] = open_ports
            print(f"[+] {ip}: {open_ports}")

    def run(self):
        threads = []
        for i in range(1, 255):
            ip = f"{self.subnet}.{i}"
            t = threading.Thread(target=self.scan_host, args=(ip,))
            threads.append(t)
            t.start()
            if len(threads) >= MAX_THREADS:
                for th in threads: th.join()
                threads = []
        for th in threads: th.join()
        return self.results

let topZ = 200;
const openWindows = {};
const minimizedWins = {};

function bringToFront(id) {
  topZ++;
  const el = document.getElementById(id);
  if (el) { el.style.zIndex = topZ; el.classList.add('focused'); }
  Object.keys(openWindows).forEach(k => {
    if (k !== id) document.getElementById(k)?.classList.remove('focused');
  });
}

function closeWin(id) {
  const el = document.getElementById(id);
  if (el) { el.remove(); delete openWindows[id]; delete minimizedWins[id]; }
}

function minimizeWin(id) {
  const el = document.getElementById(id);
  if (!el) return;
  if (minimizedWins[id]) {
    el.style.visibility = 'visible';
    minimizedWins[id] = false;
  } else {
    el.style.visibility = 'hidden';
    minimizedWins[id] = true;
  }
}

function maximizeWin(id) {
  const el = document.getElementById(id);
  if (!el) return;
  if (el.dataset.maxed === '1') {
    el.style.cssText = el.dataset.prevStyle;
    el.dataset.maxed = '0';
  } else {
    el.dataset.prevStyle = el.style.cssText;
    el.style.cssText = `left:0;top:0;width:calc(100vw - ${parseInt(getComputedStyle(document.documentElement).getPropertyValue('--dock-w'))||54}px);height:calc(100vh - 20px);z-index:${++topZ}`;
    el.dataset.maxed = '1';
  }
}

function makeWin({ id, title, glyph = '▣', w = 420, h = 320, x, y, content }) {
  if (openWindows[id]) { bringToFront(id); return null; }
  const dockW = 54;
  const taskH = 20;
  const maxX = Math.max(0, window.innerWidth - dockW - w);
  const maxY = Math.max(0, window.innerHeight - taskH - h);
  const cx = x ?? (40 + Math.floor(Math.random() * Math.min(maxX, 300)));
  const cy = y ?? (30 + Math.floor(Math.random() * Math.min(maxY, 200)));

  const win = document.createElement('div');
  win.id = id; win.className = 'win';
  win.style.cssText = `left:${cx}px;top:${cy}px;width:${w}px;height:${h}px;z-index:${++topZ}`;

  win.innerHTML = `
    <div class="win-titlebar">
      <span class="win-title-icon">${glyph}</span>
      <span class="win-title-text">${title}</span>
      <div class="win-controls">
        <button class="win-btn" onclick="minimizeWin('${id}')" title="Minimize">_</button>
        <button class="win-btn" onclick="maximizeWin('${id}')" title="Maximize">□</button>
        <button class="win-btn close" onclick="closeWin('${id}')" title="Close">✕</button>
      </div>
    </div>

    <div class="resize-handle" id="${id}-rh"></div>
  `;

  document.getElementById('win-container').appendChild(win);

  makeDraggable(win);

}

/* ── DRAG ── */
function makeDraggable(winEl) {
  const titlebar = winEl.querySelector('.win-titlebar');
  let ox, oy, sx, sy;
  titlebar.addEventListener('mousedown', e => {
    if (e.target.closest('.win-controls')) return;
    bringToFront(winEl.id);
    ox = winEl.offsetLeft; oy = winEl.offsetTop;
    sx = e.clientX; sy = e.clientY;
    const onMove = ev => {
      winEl.style.left = Math.max(0, ox + ev.clientX - sx) + 'px';
      winEl.style.top  = Math.max(0, oy + ev.clientY - sy) + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  });
  winEl.addEventListener('mousedown', () => bringToFront(winEl.id));
}

/* ── RESIZE ── */
function makeResizable(winEl, handle) {
  if (!handle) return;
  handle.addEventListener('mousedown', e => {
    const sw = winEl.offsetWidth, sh = winEl.offsetHeight;
    const sx = e.clientX, sy = e.clientY;
    const onMove = ev => {
      winEl.style.width  = Math.max(220, sw + ev.clientX - sx) + 'px';
      winEl.style.height = Math.max(100, sh + ev.clientY - sy) + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault(); e.stopPropagation();
  });
}

      if (!document.getElementById(id)) return;
      ctx.clearRect(0,0,c.width,170);

        const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if (dist < 120) {
          ctx.strokeStyle = `rgba(51,255,51,${0.08*(1-dist/120)})`;
          ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke();
        }
      }

        n.y += n.vy + Math.cos(frame*0.015+i*0.7)*0.5;
        if (n.x < n.r || n.x > c.width-n.r) n.vx *= -1;
        if (n.y < n.r || n.y > 170-n.r) n.vy *= -1;
        n.x = Math.max(n.r, Math.min(c.width-n.r, n.x));

        ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 8;

      });

  });
}

/* ═══════════════════════════════════════
   KEYBOARD HANDLER
   ═══════════════════════════════════════ */

document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName?.toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;

  // Space → close topmost window
  if (e.key === ' ') {
    e.preventDefault();
    const allWins = [...document.querySelectorAll('.win')];
    if (allWins.length) {
      let topWin = allWins[0], topZval = 0;
      allWins.forEach(w => {
        const z = parseInt(w.style.zIndex || 0);
        if (z > topZval) { topZval = z; topWin = w; }
      });
      if (topWin && openWindows[topWin.id]) closeWin(topWin.id);
    }
    return;
  }

  // Number keys → passive windows (no duplicate if already open)
  if (!isNaN(parseInt(e.key)) && e.key >= '0' && e.key <= '9') {
    openPassive(parseInt(e.key));
    return;
  }

  // Any other key → hide intro, burst bg terminal, add remote line
  hideIntro();
  bgBurst(8);
  typeRemoteLine();
});
